name: Build English Learning APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-learning-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Check and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: EnglishLearning_10_5_APK_Ready
    env:
      EXPO_TOKEN_RAW: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate and normalize Expo token
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const raw = process.env.EXPO_TOKEN_RAW || '';
          const token = raw.trim().replace(/[\r\n]/g, '');
          if (!token) {
            console.error('::error::Add the EXPO_TOKEN repository secret in GitHub Actions settings.');
            process.exit(1);
          }
          if (/[\s\x00-\x1f\x7f]/.test(token) || /[^\x21-\x7e]/.test(token)) {
            console.error('::error::EXPO_TOKEN contains whitespace or invalid characters. Recreate and paste only the full raw token.');
            process.exit(1);
          }
          console.log('::add-mask::' + token);
          fs.appendFileSync(process.env.GITHUB_ENV, 'EXPO_TOKEN=' + token + '\n');
          console.log('Expo token format checked without displaying its value.');
          NODE

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Check Expo dependency compatibility
        run: npx --yes expo-doctor

      - name: Compile JavaScript bundle (catch JSX and import errors)
        run: npx expo export --platform android --output-dir /tmp/english-learning-bundle-check

      - name: Verify app and existing EAS project
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          if (app.extra?.eas?.projectId !== '956b20e5-fa85-44da-889a-2dda2cdf10ec') throw new Error('Missing or wrong Expo project ID');
          if (app.owner !== 'dangduythus-team') throw new Error('Wrong Expo owner');
          if (app.android?.package !== 'com.englishlearning.personalapp') throw new Error('Android package changed');
          if (eas.build?.preview?.android?.buildType !== 'apk') throw new Error('Preview profile must build an APK');
          console.log('Verified:', app.version, app.android.package, 'versionCode', app.android.versionCode);
          NODE

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo authentication
        run: eas whoami

      - name: Build APK on Expo EAS
        run: eas build --platform android --profile preview --non-interactive

      - name: Build download location
        if: success()
        run: |
          echo "APK build finished. Open the Expo Builds page to download the signed APK."
          echo "https://expo.dev/accounts/dangduythus-team/projects/english-learning-personal/builds"
